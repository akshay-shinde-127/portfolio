name: Playwright CI & E2E Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run once daily at 06:00 UTC against the live deployed GitHub Pages site
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Test target environment'
        required: true
        default: 'local'
        type: choice
        options:
          - 'local'
          - 'live'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Playwright Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps 

      - name: Execute Tests (Local Server Target)
        if: github.event_name != 'schedule' && (github.event.inputs.target == 'local' || github.event.inputs.target == null)
        run: npm run test:update-snapshots && npm test

      - name: Execute Tests (Live GitHub Pages Target)
        if: github.event_name == 'schedule' || github.event.inputs.target == 'live'
        run: npm run test:live

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html
          retention-days: 30

      - name: Upload Test Results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-results
          path: reports/results.json
          retention-days: 30
